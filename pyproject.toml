[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-swaper"
version = "0.8.1"
description = "Select Claude Code account profiles manually and check usage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ccs = "cc_swaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
